name: SimpleNick
version: '1.0.0'
main: de.mcsnack.simplenick.SimpleNick
api-version: '26.3'
description: Lightweight OP-only nickname commands
commands:
  nick:
    description: Set a nickname for an online player
    usage: /nick <player> <nickname>
    permission: simplenick.admin
  unnick:
    description: Remove a nickname
    usage: /unnick <player>
    permission: simplenick.admin
  nicklist:
    description: List active nicknames
    usage: /nicklist
    permission: simplenick.admin
permissions:
  simplenick.admin:
    description: Allows nickname administration
    default: op
