name: SimpleNick
version: '2.2.0'
main: de.mcsnack.simplenick.SimpleNick
api-version: '26.3'
description: OP-only nicknames and colored group prefixes
commands:
  nick:
    usage: /nick <player> <nickname>
    permission: simplenick.admin
  unnick:
    usage: /unnick <player>
    permission: simplenick.admin
  nicklist:
    usage: /nicklist
    permission: simplenick.admin
  group:
    usage: /group [player] <group> <color>
  ungroup:
    usage: /ungroup [player]
permissions:
  simplenick.admin:
    default: op
